<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Glove Valet Waste | Premium Doorstep Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --black: #0a0a0a;
            --white: #ffffff;
            --gray: #1a1a1a;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--black);
            color: var(--white);
            scroll-behavior: smooth;
        }

        /* Nav */
        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .nav-logo { height: 40px; }

        /* Hero */
        .hero {
            padding: 100px 5%;
            text-align: center;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
        }

        .main-logo {
            max-width: 250px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 0px 15px rgba(212, 175, 55, 0.3));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--gold);
            margin: 10px 0;
        }

        /* Truck Display */
        .truck-box {
            padding: 60px 5%;
            text-align: center;
        }

        .truck-img {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--gold);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Contact Form */
        .contact-section {
            padding: 80px 5%;
            background: var(--gray);
            text-align: center;
        }

        form {
            max-width: 500px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }

        input:focus { border-color: var(--gold); outline: none; }

        .btn {
            background: var(--gold);
            color: black;
            padding: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover { background: #f3e5ab; }
    </style>
</head>
<body>

    <nav>
        <img src="logo.png" alt="WGW" class="nav-logo">
        <a href="#contact" class="btn" style="padding: 10px 20px;">Contact Us</a>
    </nav>

    <header class="hero">
        <img src="logo.png" alt="White Glove Waste Logo" class="main-logo">
        <h1>Luxury Valet Trash Collection</h1>
        <p style="letter-spacing: 2px;">PREMIUM SERVICE | PRISTINE COMMUNITIES</p>
    </header>

    <section class="truck-box">
        <h2 style="font-family: 'Playfair Display'; margin-bottom: 30px;">Our Professional Fleet</h2>
        <img src="truck.jpg" alt="Our Service Truck" class="truck-img">
    </section>

    <section id="contact" class="contact-section">
        <h2 style="font-family: 'Playfair Display'; color: var(--gold);">Inquire for Your Property</h2>
        <form>
            <input type="text" placeholder="Property Name" required>
            <input type="email" placeholder="Email Address" required>
            <textarea rows="5" placeholder="Tell us about your community..."></textarea>
            <button type="submit" class="btn">Request a Proposal</button>
        </form>
    </section>

    <footer style="padding: 40px; text-align: center; font-size: 0.8rem; color: #555;">
        &copy; 2026 WHITE GLOVE WASTE VALET SERVICE
    </footer>

</body>
</html>
